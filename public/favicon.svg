<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 315 200" width="200" height="127" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="am-fav-grad" x1="0" y1="40" x2="0" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C3AED" />
      <stop offset="0.5" stop-color="#A855F7" />
      <stop offset="1" stop-color="#D946EF" />
    </linearGradient>
    <clipPath id="am-fav-clip">
      <rect x="0" y="40" width="315" height="120" />
    </clipPath>
  </defs>

  <!-- Letter A -->
  <path d="M 40,160 L 90,40 L 140,160" clip-path="url(#am-fav-clip)" stroke="url(#am-fav-grad)" stroke-width="26" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" />
  <line x1="62" y1="115" x2="118" y2="115" clip-path="url(#am-fav-clip)" stroke="url(#am-fav-grad)" stroke-width="26" />
  <!-- Letter M -->
  <path d="M 175,160 L 175,40 L 225,130 L 275,40 L 275,160" clip-path="url(#am-fav-clip)" stroke="url(#am-fav-grad)" stroke-width="26" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" />
</svg>