<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <!-- Demo hero portrait placeholder — abstract studio silhouette.
       Replace by placing your real photo at /avatar.png -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#243049"/>
      <stop offset="0.55" stop-color="#141d33"/>
      <stop offset="1" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#ec4899" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#e2e8f0" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="ambient" cx="0.5" cy="0.28" r="0.75">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#ec4899" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="500" fill="#0b1120"/>
  <rect width="400" height="500" fill="url(#ambient)"/>

  <!-- shoulders / upper torso -->
  <path d="M52 500 C58 396 118 336 200 330 C282 336 342 396 348 500 Z" fill="url(#body)"/>
  <!-- neck -->
  <path d="M172 268 L172 330 Q200 346 228 330 L228 268 Z" fill="url(#body)"/>
  <!-- head -->
  <ellipse cx="200" cy="182" rx="64" ry="76" fill="url(#body)"/>

  <!-- rim light strokes -->
  <path d="M52 500 C58 396 118 336 200 330" fill="none" stroke="url(#rim)" stroke-width="2.5" opacity="0.85"/>
  <path d="M136 128 C142 84 168 62 200 62 C232 62 258 84 264 128" fill="none" stroke="url(#rim)" stroke-width="2.5" opacity="0.85"/>
  <path d="M264 150 C272 210 250 250 236 262" fill="none" stroke="url(#rim)" stroke-width="1.8" opacity="0.45"/>

  <!-- faint facial plane suggestion (kept abstract) -->
  <ellipse cx="200" cy="196" rx="40" ry="48" fill="#e2e8f0" opacity="0.03"/>
</svg>